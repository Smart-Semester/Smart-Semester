services:
  db:
    image: postgres:16-alpine
    container_name: smart_semester_db
    environment:
      POSTGRES_DB: smart_semester
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_semester"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: smart_semester_catalog
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/smart_semester
      PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
